<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Stock Info Service" }}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version() }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="/static/app.js?v={{ asset_version() }}" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/">Stock Info</a>
    <nav>
      <a href="/">概览</a>
      {% if app_mode != "admin" %}
      <a href="/watchlist">自选股</a>
      {% endif %}
      <a href="/info">信息库</a>
      <a href="/indices">指数</a>
      {% if app_mode != "admin" %}
      <a href="/briefs">简报</a>
      <a href="/chat">AI 对话</a>
      <a href="/alerts">监控</a>
      {% endif %}
      <a href="/settings">设置</a>
      <a href="/jobs">任务</a>
      <a href="/users">用户审核</a>
      {% if app_mode == "admin" %}
      <form method="post" action="/admin/logout"><button class="nav-button" type="submit">退出管理台</button></form>
      {% endif %}
    </nav>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <div class="progress-overlay" data-progress-overlay hidden>
    <div class="progress-card">
      <strong data-progress-title>正在处理</strong>
      <p data-progress-message>请稍等，任务完成后页面会自动更新。</p>
      <p class="progress-job" data-progress-job></p>
      <div class="progress-track" aria-hidden="true"><span></span></div>
      <progress aria-label="任务进度"></progress>
    </div>
  </div>
</body>
</html>
