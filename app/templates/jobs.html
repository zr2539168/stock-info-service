{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>采集任务</h1>
  <div class="button-row">
    <form method="post" action="/jobs/run/all" data-progress="正在抓取全部信息">
      <button type="submit" data-collection-button {% if collection_running %}disabled{% endif %}>
        {% if collection_running %}后台正在抓取信息{% else %}手动抓取信息{% endif %}
      </button>
    </form>
  </div>
</header>
<section class="panel">
  <table>
    <thead><tr><th>任务</th><th>状态</th><th>开始</th><th>结束</th><th>错误</th></tr></thead>
    <tbody>
    {% for job in jobs %}
      <tr>
        <td>{{ job.job_name }}</td>
        <td>{{ job.status }}</td>
        <td>{{ job.started_at | beijing_time }}</td>
        <td>{{ job.ended_at | beijing_time if job.ended_at else "-" }}</td>
        <td>{{ job.error }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
