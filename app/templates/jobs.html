{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>采集任务</h1>
  <div class="button-row">
    <form method="post" action="/jobs/run/all" data-progress="正在抓取全部信息"><button type="submit">抓全部信息</button></form>
    <form method="post" action="/jobs/run/quotes" data-progress="正在抓取行情"><button type="submit">抓行情</button></form>
    <form method="post" action="/jobs/run/details" data-progress="正在抓取交易和盘口信息"><button type="submit">抓交易/盘口</button></form>
    <form method="post" action="/jobs/run/news" data-progress="正在抓取新闻"><button type="submit">抓新闻</button></form>
    <form method="post" action="/jobs/run/announcements" data-progress="正在抓取公告"><button type="submit">抓公告</button></form>
    <form method="post" action="/jobs/run/macro" data-progress="正在抓取宏观信息"><button type="submit">抓宏观</button></form>
    <form method="post" action="/jobs/run/brief" data-progress="正在抓取信息并生成 AI 简报"><button type="submit">抓取并生成简报</button></form>
  </div>
</header>
<section class="panel">
  <table>
    <thead><tr><th>任务</th><th>状态</th><th>开始</th><th>结束</th><th>错误</th></tr></thead>
    <tbody>
    {% for job in jobs %}
      <tr>
        <td>{{ job.job_name }}</td>
        <td>{{ job.status }}</td>
        <td>{{ job.started_at | beijing_time }}</td>
        <td>{{ job.ended_at | beijing_time if job.ended_at else "-" }}</td>
        <td>{{ job.error }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
