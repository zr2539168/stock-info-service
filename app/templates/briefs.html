{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <div>
    <h1>AI 简报</h1>
    <p>基于信息库中已抓取的自选股资料生成结构化摘要。</p>
  </div>
  <form class="page-actions" method="post" action="/briefs/generate" data-progress="正在抓取信息并生成 AI 简报">
    <label class="inline-check"><input type="checkbox" name="push" value="true"> 生成后推送</label>
    <button type="submit">抓取并生成简报</button>
  </form>
</header>


<form method="post" action="/briefs/delete" class="panel brief-list">
  <div class="bulk-toolbar">
    <label class="inline-check"><input type="checkbox" data-select-all=".brief-check"> 全选</label>
    <button class="ghost danger" type="submit">删除所选简报</button>
  </div>
  {% for brief in briefs %}
    <article class="brief selectable-record">
      <input class="brief-check record-check" type="checkbox" name="item_ids" value="{{ brief.id }}">
      <div class="record-content">
        <div class="record-head">
          <h2>{{ brief.title }}</h2>
          <time>{{ brief.generated_at | beijing_time }}</time>
        </div>
        <div class="markdown-body">{{ brief.content | stock_refs(stocks) | markdown }}</div>
      </div>
    </article>
  {% else %}
    <p class="muted">暂无简报。</p>
  {% endfor %}
</form>
{% endblock %}
