{% extends "base.html" %}
{% block content %}
<header class="page-head"><h1>设置</h1></header>
{% if message %}<div class="notice">{{ message }}</div>{% endif %}
<section class="panel narrow">
  <h2>全局采集</h2>
  <form method="post" action="/settings" class="settings-form">
    <label class="inline-check">
      <input name="collection_enabled" type="checkbox" value="true" {% if settings.collection_enabled == "true" %}checked{% endif %}>
      开启后台定时抓取信息
    </label>
    <label>采集 Cron（五段）<input name="collect_all_cron" value="{{ settings.collect_all_cron }}" required></label>
    <p class="muted">默认每小时抓取所有用户启用自选股的并集，并同步市场指数。用户的 DeepSeek Key、简报时间和微信通知授权在小程序内单独设置。</p>
    <button type="submit">保存配置</button>
  </form>
</section>
{% endblock %}
