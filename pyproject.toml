[project]
name = "stock-info-service"
version = "0.1.0"
description = "Multi-user stock market information service for WeChat Mini Program and Web administration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "akshare>=1.16.0",
    "apscheduler>=3.10.4",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "markdown-it-py>=3.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pymysql>=1.1.1",
    "sqlmodel>=0.0.22",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
